<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Class — DamiDev</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="quiz.css">
</head>

<body>

    <div class="noise"></div>

    <div class="container">

        <!-- Welcome Screen -->
        <div id="welcomeScreen" class="welcome-screen">
            <div class="welcome-badge">10 Questions</div>
            <h1 class="welcome-title">Quiz<br>Class</h1>
            <p class="welcome-sub">Test your knowledge across science, culture & more.</p>
            <button id="startButton" class="btn-start">
                Begin Quiz
                <span class="btn-arrow">→</span>
            </button>
            <p class="welcome-brand">by DamiDev</p>
        </div>

        <!-- Quiz Screen -->
        <div id="quizScreen" class="quiz-screen" style="display:none;">
            <div class="quiz-header">
                <div class="progress-bar-wrap">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="quiz-meta">
                    <span id="questionCounter" class="question-counter">1 / 10</span>
                    <span id="scoreDisplay" class="score-display">Score: 0</span>
                </div>
            </div>

            <div class="question-wrap">
                <h2 id="question" class="question-text"></h2>
            </div>

            <div id="answer-buttons" class="answer-grid"></div>

            <div class="next-wrap">
                <button id="next-btn" class="btn-next" style="display:none;">
                    Next <span>→</span>
                </button>
            </div>
        </div>

        <!-- Score Screen -->
        <div id="scoreScreen" class="score-screen" style="display:none;">
            <div class="score-badge" id="scoreBadge"></div>
            <h2 class="score-heading" id="scoreHeading"></h2>
            <p class="score-msg" id="scoreMsg"></p>
            <div class="score-fraction" id="scoreFraction"></div>
            <button id="restartBtn" class="btn-start">
                Play Again <span class="btn-arrow">→</span>
            </button>
        </div>

    </div>

    <script src="quiz.js"></script>
</body>

</html>
